<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
</head>

<body>

    <h2>Set New Password</h2>

    {% if validlink %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>

        </form>

    {% else %}

        <h3>
            This password reset link is invalid or has expired.
        </h3>

    {% endif %}

</body>
</html>
